[project]
name = "negin"
version = "0.1.0"
description = "Crypto technical + news-sentiment signal engine with backtesting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "feedparser>=6.0",
]

[project.scripts]
negin = "negin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
